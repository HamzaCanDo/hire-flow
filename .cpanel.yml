---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kitbinto/hamzaa.top/hireflow_app
    - export PUBLICPATH=/home/kitbinto/hamzaa.top/hireflow
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $PUBLICPATH
    - /bin/cp -R app $DEPLOYPATH/
    - /bin/cp -R bootstrap $DEPLOYPATH/
    - /bin/cp -R config $DEPLOYPATH/
    - /bin/cp -R database $DEPLOYPATH/
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R resources $DEPLOYPATH/
    - /bin/cp -R routes $DEPLOYPATH/
    - /bin/cp -R storage $DEPLOYPATH/
    - /bin/cp -R tests $DEPLOYPATH/
    - /bin/cp artisan composer.json composer.lock package.json phpunit.xml vite.config.js $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp index.php $DEPLOYPATH/
    - /bin/cp .env.example $DEPLOYPATH/
    - /bin/cp -R public/. $PUBLICPATH/
